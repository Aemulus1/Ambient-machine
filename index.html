<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE AMBIENT MACHINE v0.1</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080b15;color:#e5ecff;font:15px system-ui,-apple-system,sans-serif}.wrap{max-width:980px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:clamp(20px,4vw,32px);letter-spacing:.12em;margin:0}small,.muted{color:#94a2c0}.screen{position:relative;background:radial-gradient(ellipse at center,#121b34,#070a12 72%);border:1px solid #263552;border-radius:18px;overflow:hidden;margin:20px 0 14px}canvas{display:block;width:100%;height:360px}.overlay{position:absolute;bottom:16px;left:20px;right:20px;display:flex;justify-content:space-between;color:#a9bbdf;font-size:12px;pointer-events:none}.panel{background:#101827;border:1px solid #29344c;border-radius:16px;padding:18px}.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}label{display:flex;justify-content:space-between;margin-bottom:8px}input[type=range]{width:100%;accent-color:#91aaff}button{border:0;border-radius:10px;padding:12px 22px;background:#91aaff;color:#091021;font-weight:800;cursor:pointer}button:disabled{opacity:.5}button.secondary{background:#293752;color:#dce7ff}.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0}.status{color:#b8c8e6}footer{color:#7586a4;font-size:12px;margin:18px 0}@media(max-width:560px){.controls{grid-template-columns:1fr}canvas{height:290px}.wrap{padding:14px}}</style></head><body><div class="wrap"><header><div><h1>THE AMBIENT MACHINE</h1><small>v0.1 · FIRST PULSE · generative sound ecosystem</small></div><small>Built by Kris &amp; Omnia</small></header><div class="screen"><canvas id="viz"></canvas><div class="overlay"><span id="scene">SILENCE</span><span id="measure">BAR —</span></div></div><div class="actions"><button id="start">▶ START</button><button id="stop" class="secondary" disabled>■ STOP</button><span class="status" id="status">Klaar om te ontwaken</span></div><div class="panel"><div class="controls"><div><label>Tempo <output id="bpmV">91 BPM</output></label><input id="bpm" type="range" min="55" max="140" value="91"></div><div><label>Klankdichtheid <output id="densityV">35%</output></label><input id="density" type="range" min="0" max="100" value="35"></div><div><label>Evolutie <output id="evolutionV">55%</output></label><input id="evolution" type="range" min="0" max="100" value="55"></div><div><label>Echo / Reverb <output id="reverbV">65%</output></label><input id="reverb" type="range" min="0" max="100" value="65"></div></div></div><footer>Autonome compositie · Web Audio API · geen internet of samples nodig · start vereist een tik/klik wegens browser-audiobeveiliging.</footer></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let ctx,master,dry,wet,delay,feedback,filter,noiseBuffer,started=false,timer=null,step=0,nextTime=0,energy=0,bar=0,seed=0,mode=0,lastPitch=0;let bpm=91,density=.35,evolution=.55,reverb=.65;const notes=[0,2,3,5,7,10],chords=[[0,3,7],[5,8,12],[3,7,10],[7,10,14]],root=43;const random=(a,b)=>a+Math.random()*(b-a),choose=a=>a[Math.floor(Math.random()*a.length)],hz=m=>440*Math.pow(2,(m-69)/12);const canvas=$('viz'),g=canvas.getContext('2d');let width=0,height=0;function resize(){const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);g.setTransform(d,0,0,d,0,0);width=r.width;height=r.height}window.addEventListener('resize',resize);resize();function makeNoise(){noiseBuffer=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);const a=noiseBuffer.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}function impulse(){let len=Math.round(ctx.sampleRate*3.4),b=ctx.createBuffer(2,len,ctx.sampleRate);for(let c=0;c<2;c++){let d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.9)}return b}function setup(){ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.66;const compressor=ctx.createDynamicsCompressor();compressor.threshold.value=-20;compressor.knee.value=22;compressor.ratio.value=3;master.connect(compressor);compressor.connect(ctx.destination);dry=ctx.createGain();dry.gain.value=.8;dry.connect(master);wet=ctx.createGain();wet.connect(master);const con=ctx.createConvolver();con.buffer=impulse();con.connect(wet);const revSend=ctx.createGain();revSend.connect(con);delay=ctx.createDelay(2);delay.delayTime.value=60/bpm*.75;feedback=ctx.createGain();feedback.gain.value=.27;delay.connect(feedback);feedback.connect(delay);const echoOut=ctx.createGain();echoOut.gain.value=.18;delay.connect(echoOut);echoOut.connect(wet);filter=ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=3600;filter.connect(dry);filter.connect(revSend);filter.connect(delay);makeNoise();updateFx()}function updateFx(){if(!ctx)return;wet.gain.setTargetAtTime(.25+reverb*.35,ctx.currentTime,.1);feedback.gain.setTargetAtTime(.12+reverb*.27,ctx.currentTime,.1);delay.delayTime.setTargetAtTime(60/bpm*.75,ctx.currentTime,.1)}function env(g,t,attack,hold,release,peak){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+attack);g.gain.setValueAtTime(peak,t+attack+hold);g.gain.exponentialRampToValueAtTime(.0001,t+attack+hold+release)}function osc(freq,t,dur,type='sine',vol=.1,attack=.02,dest=filter){const o=ctx.createOscillator(),a=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);o.connect(a);a.connect(dest);env(a,t,attack,Math.max(.01,dur-attack-.3),.3,vol);o.start(t);o.stop(t+dur+.15);return o}function kick(t){const o=ctx.createOscillator(),a=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(125,t);o.frequency.exponentialRampToValueAtTime(44,t+.22);o.connect(a);a.connect(dry);a.gain.setValueAtTime(.0001,t);a.gain.exponentialRampToValueAtTime(.5,t+.009);a.gain.exponentialRampToValueAtTime(.0001,t+.5);o.start(t);o.stop(t+.52);pulse(t,.9)}function hat(t){const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),a=ctx.createGain();s.buffer=noiseBuffer;f.type='highpass';f.frequency.value=6000;s.connect(f);f.connect(a);a.connect(dry);env(a,t,.004,.005,.09,.025);s.start(t);s.stop(t+.12);pulse(t,.15)}function bell(t,m){const f=hz(m);osc(f,t,1.7,'sine',.09,.004);osc(f*2.01,t,1.0,'sine',.027,.003);osc(f*3.99,t,.5,'sine',.009,.003);pulse(t,.35)}function pad(t,notes){notes.forEach((n,i)=>{const f=hz(n);const o=ctx.createOscillator(),a=ctx.createGain(),lp=ctx.createBiquadFilter();o.type=i===1?'triangle':'sine';o.frequency.setValueAtTime(f,t);o.detune.value=random(-5,5);lp.type='lowpass';lp.frequency.setValueAtTime(random(600,1200),t);o.connect(lp);lp.connect(a);a.connect(filter);a.gain.setValueAtTime(.0001,t);a.gain.linearRampToValueAtTime(.048,t+1.5);a.gain.setValueAtTime(.048,t+4.8);a.gain.linearRampToValueAtTime(.0001,t+8.2);o.start(t);o.stop(t+8.25)});pulse(t,.3)}function bass(t,m){osc(hz(m),t,.7,'triangle',.06,.015);pulse(t,.23)}let pulses=[];function pulse(t,strength){pulses.push({t,s:strength});if(pulses.length>80)pulses.shift()}function schedule(t,s){const pos=s%16;if(pos===0){bar++;$('measure').textContent='BAR '+bar;if(bar===1){$('scene').textContent='FIRST PULSE'}else if(bar<3){$('scene').textContent='AWAKENING'}else{$('scene').textContent=['BLOOM','DRIFT','RESONANCE','STARDUST'][mode]};if(bar>2&&bar%8===1&&Math.random()<evolution){mode=(mode+choose([1,1,2]))%4;seed=(seed+choose([-1,1]))%chords.length}if(bar>2&&bar%4===1){seed=(seed+1+chords.length)%chords.length}if(bar>=3&&bar%4===1)pad(t,chords[seed].map(n=>root+n+12));}if(s===0)kick(t);if(bar>1&&pos===8&&Math.random()<.45+density*.4)kick(t);if(bar>2&&pos%4===2&&Math.random()<density*.6)hat(t);if(bar>2&&pos===0&&Math.random()<density*.8)bass(t,root+chords[seed][0]-12);if(bar>2&&pos%4===0&&Math.random()<density*.2){const allowed=chords[seed].map(n=>root+n+24);let n=choose(allowed);if(Math.random()<.65)n=allowed.reduce((a,b)=>Math.abs(a-lastPitch)<Math.abs(b-lastPitch)?a:b);lastPitch=n;bell(t,n)}if(bar>3&&pos===12&&Math.random()<density*.5)bell(t,root+choose(chords[seed])+24)}function tick(){if(!started||!ctx)return;let now=ctx.currentTime;while(nextTime<now+.16){schedule(nextTime,step);step++;nextTime+=60/bpm/4}if(nextTime<now-.5)nextTime=now+.04}async function start(){if(started)return;try{if(!ctx)setup();await ctx.resume();started=true;step=0;bar=0;mode=0;seed=Math.floor(Math.random()*4);nextTime=ctx.currentTime+.08;pulses=[];timer=setInterval(tick,25);tick();$('start').disabled=true;$('stop').disabled=false;$('status').textContent='De machine componeert…'}catch(e){$('status').textContent='Audio kon niet starten: '+e.message}}async function stop(){if(!started)return;started=false;clearInterval(timer);timer=null;await ctx.suspend();$('start').disabled=false;$('stop').disabled=true;$('scene').textContent='SILENCE';$('status').textContent='Gestopt · druk START om opnieuw te beginnen'}$('start').onclick=start;$('stop').onclick=stop;[['bpm',v=>{bpm=+v;updateFx();}],['density',v=>density=v/100],['evolution',v=>evolution=v/100],['reverb',v=>{reverb=v/100;updateFx()}]].forEach(([id,fn])=>{$(id).addEventListener('input',e=>{fn(+e.target.value);$(id+'V').textContent=e.target.value+(id==='bpm'?' BPM':'%')})});function draw(now){requestAnimationFrame(draw);const w=width,h=height;g.clearRect(0,0,w,h);g.fillStyle='#080d1a';g.fillRect(0,0,w,h);const t=now*.001;let intensity=0;if(started&&ctx){const ct=ctx.currentTime;pulses=pulses.filter(p=>ct-p.t<1.4);for(const p of pulses){const age=ct-p.t;if(age>=0)intensity+=p.s*Math.exp(-age*5)}energy=energy*.86+intensity*.14}else energy*=.95;const cx=w/2,cy=h/2,r=Math.min(w*.23,h*.32),shape=2+mode*1.25+(started?Math.sin(t*.12)*.17:0);for(let k=0;k<19;k++){const hue=195+k*5+mode*14;g.beginPath();for(let i=0;i<=420;i++){const a=i/420*Math.PI*2;const rr=r*(.62+.29*Math.cos(shape*a+k*.05))*(1+energy*.13)+k*.6;const x=cx+rr*Math.cos(a),y=cy+rr*Math.sin(a);if(i===0)g.moveTo(x,y);else g.lineTo(x,y)}g.closePath();g.strokeStyle=`hsla(${hue},95%,${62+k*.7}%,${.12+k*.019+energy*.035})`;g.lineWidth=.75+(k%5===0?.6:0);g.stroke()}const glow=g.createRadialGradient(cx,cy,1,cx,cy,r*1.5);glow.addColorStop(0,`rgba(100,180,255,${.045+energy*.1})`);glow.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=glow;g.fillRect(0,0,w,h)}requestAnimationFrame(draw);})();
</script></body></html>
